[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-human-agent"
version = "0.1.0"
description = "Autonomous human-paced computer agent with guarded bridges, memory, skill store, and verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
gui = [
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
    "scikit-image>=0.24.0",
    "pillow>=10.4.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
human-agent = "agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]